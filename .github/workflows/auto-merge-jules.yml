name: Auto-merge Jules PRs

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  auto_merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate Auto-merge conditions
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;

            // Get the pull requests associated with the successful run
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id
            });

            const prs = run.data.pull_requests;
            if (prs.length === 0) {
              console.log("No PRs associated with this successful CI run. Exiting.");
              return;
            }

            const pr_number = prs[0].number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const prData = pr.data;

            // 1. Correct repository (not fork)
            if (prData.head.repo.full_name !== context.payload.repository.full_name) {
              console.log("PR is from a fork. Blocking auto-merge.");
              return;
            }

            // 2. Correct production/default base
            const default_branch = context.payload.repository.default_branch;
            if (prData.base.ref !== default_branch) {
              console.log(`PR base is not the default branch (${default_branch}). Blocking auto-merge.`);
              return;
            }

            // 3. Not draft
            if (prData.draft) {
              console.log("PR is a draft. Blocking auto-merge.");
              return;
            }

            // 4. Valid Jules provenance
            if (prData.user.login !== "google-labs-jules[bot]") {
              console.log(`PR author is ${prData.user.login}, not google-labs-jules[bot]. Blocking auto-merge.`);
              return;
            }

            // 5. Exact SHA validation
            const current_head_sha = prData.head.sha;
            const ci_sha = run.data.head_sha;
            if (current_head_sha !== ci_sha) {
              console.log(`SHA mismatch: PR HEAD ${current_head_sha} != CI SHA ${ci_sha}. Blocking auto-merge.`);
              return;
            }

            // 6. No merge conflict
            if (prData.mergeable !== true) {
              console.log("PR has conflicts or mergeable state is unknown. Blocking auto-merge.");
              return;
            }

            // 7. High-risk file check
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const highRiskPatterns = [
              /^\.github\/workflows\/.*/,
              /^AGENTS\.md$/,
              /^opencode\.json$/,
              /^bot\/config\.py$/,
              /auth/,
              /secrets/,
              /migration/,
              /deploy/,
              /infrastructure/,
              /security/,
              /broker/,
              /PAPER_MODE/,
              /permissions/
            ];

            const hasHighRisk = files.data.some(file =>
              highRiskPatterns.some(pattern => pattern.test(file.filename))
            );

            if (hasHighRisk) {
              console.log("PR modifies high-risk paths. Blocking auto-merge.");
              return;
            }

            // 8. Execute squash merge
            console.log("All safety gates passed. Attempting squash merge.");
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
                merge_method: 'squash',
                sha: current_head_sha // Enforce merging the exact validated SHA
              });
              console.log(`Successfully auto-merged PR #${pr_number}`);
            } catch (error) {
              console.error("Auto-merge failed:", error);
            }
