name: Jules Autonomous Engineering

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      fallback_branch:
        description: 'Branch to run on if resolution fails'
        required: false
        default: 'main'

jobs:
  run-jules:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@jules') }}
    steps:
      - name: Resolve Default Branch
        id: resolve-branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('default_branch', data.default_branch);
            } catch (err) {
              core.setOutput('default_branch', '${{ github.event.inputs.fallback_branch || 'main' }}');
            }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-branch.outputs.default_branch }}

      - name: Run Jules
        uses: google-labs-code/jules-action@v1.0.0
        with:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          AUTO_CREATE_PR: 'true'
          starting_branch: ${{ steps.resolve-branch.outputs.default_branch }}
