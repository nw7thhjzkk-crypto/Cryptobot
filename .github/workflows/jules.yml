name: Jules Task Automation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'The task for Jules to perform'
        required: true
        type: string
      starting_branch:
        description: 'Branch for Jules to start from (leave empty to use default branch dynamically)'
        required: false
        type: string
  repository_dispatch:
    types: [jules_task]

jobs:
  invoke_jules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate and Extract Input
        id: extract_input
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "prompt=${{ github.event.inputs.prompt }}" >> $GITHUB_OUTPUT
            echo "starting_branch=${{ github.event.inputs.starting_branch }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "prompt=${{ github.event.client_payload.prompt }}" >> $GITHUB_OUTPUT
            echo "starting_branch=${{ github.event.client_payload.starting_branch }}" >> $GITHUB_OUTPUT
          fi
      - name: Get default branch if not specified
        id: resolve_branch
        run: |
          BRANCH="${{ steps.extract_input.outputs.starting_branch }}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            BRANCH="${{ github.event.repository.default_branch }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
      - name: Invoke Jules
        uses: google-labs-code/jules-action@v1
        with:
          prompt: ${{ steps.extract_input.outputs.prompt }}
          starting_branch: ${{ steps.resolve_branch.outputs.branch }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          automation_mode: AUTO_CREATE_PR
