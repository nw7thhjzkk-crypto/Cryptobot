name: Trading Bot

on:
  schedule:
    # Every 5 hours 50 min so there is a small buffer before the 6h hard limit
    - cron: '50 */6 * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: trading-bot
  cancel-in-progress: false   # Never kill a running bot mid-loop

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 350 minutes = safe under GitHub's ~6 hour job limit
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run trading bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        PAPER_MODE: ${{ secrets.PAPER_MODE }}
        WATCHLIST: ${{ secrets.WATCHLIST }}
        MEAN_REVERSION_ELIGIBLE: ${{ secrets.MEAN_REVERSION_ELIGIBLE }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python -m bot.main
