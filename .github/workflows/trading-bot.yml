name: Trading Bot

on:
  schedule:
    - cron: '50 */6 * * *'
  workflow_dispatch:

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run trading bot
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        PAPER_MODE: ${{ secrets.PAPER_MODE }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # WATCHLIST intentionally not set from secrets — empty secret was
        # overriding defaults and processing 0 symbols. Defaults live in bot/config.py:
        # AAPL,MSFT,SPY,QQQ,NVDA,BTC/USD,ETH/USD
      run: |
        python -m bot.main
