name: Grok Review & Auto-Merge

on:
  workflow_run:
    workflows: ["Trading Bot"]
    types:
      - completed

jobs:
  review_and_merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Fetch PR Details
        id: fetch-pr
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRunId = context.payload.workflow_run.id;
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRunId
            });
            const prs = run.data.pull_requests;
            if (prs.length === 0) {
              console.log("No PRs found for this workflow run.");
              return;
            }
            const pr = prs[0];
            const prDetails = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            return {
              number: pr.number,
              head_sha: prDetails.data.head.sha,
              base_branch: prDetails.data.base.ref,
              author: prDetails.data.user.login,
              state: prDetails.data.state,
              is_draft: prDetails.data.draft,
              head_repo_id: prDetails.data.head.repo.id,
              base_repo_id: prDetails.data.base.repo.id,
              html_url: prDetails.data.html_url
            };

      - name: Validate PR Eligibility
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const pr = ${{ steps.fetch-pr.outputs.result }};
            if (!pr) {
              core.setFailed("PR not found.");
              return;
            }
            if (pr.state !== 'open') core.setFailed("PR is not open.");
            if (pr.is_draft) core.setFailed("PR is a draft.");

            const expectedSha = context.payload.workflow_run.head_sha;
            if (pr.head_sha !== expectedSha) {
              core.setFailed(`SHA mismatch. PR HEAD: ${pr.head_sha}, Workflow HEAD: ${expectedSha}`);
            }

            if (pr.head_repo_id !== pr.base_repo_id) {
               core.setFailed("PR is from a fork, not permitted.");
            }

            const defaultBranchResponse = await github.rest.repos.get({
               owner: context.repo.owner,
               repo: context.repo.repo
            });
            const defaultBranch = defaultBranchResponse.data.default_branch;

            if (pr.base_branch !== defaultBranch && !pr.base_branch.startsWith('feature/paper-trading-bot-')) {
               core.setFailed(`PR base branch ${pr.base_branch} is not the default branch or a production branch.`);
            }

            // Jules provenance check
            const commits = await github.rest.pulls.listCommits({
               owner: context.repo.owner,
               repo: context.repo.repo,
               pull_number: pr.number
            });

            let isJules = false;
            for (const commit of commits.data) {
                if (commit.commit.author.name === "google-labs-jules[bot]" || commit.commit.author.email.includes("jules")) {
                    isJules = true;
                    break;
                }
            }
            if (!isJules) {
                core.setFailed("Could not verify Jules provenance for this PR.");
            }

            core.setOutput("pr_number", pr.number);
            core.setOutput("head_sha", pr.head_sha);

      - name: Fetch PR Files
        id: files
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.validate.outputs.pr_number }};
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const fileNames = files.data.map(f => f.filename);

            const highRiskPatterns = [
              /^\.github\/workflows\//,
              /^AGENTS\.md$/,
              /^opencode\.json$/,
              /bot\/broker\.py/,
              /bot\/execution\.py/,
              /bot\/risk\.py/,
              /bot\/portfolio\.py/,
              /bot\/config\.py/,
              /bot\/agents\//,
              /bot\/consensus\.py/,
              /server\.py/
            ];

            for (const filename of fileNames) {
               for (const pattern of highRiskPatterns) {
                   if (pattern.test(filename)) {
                       core.setFailed(`PR modifies high-risk file: ${filename}. Manual review required.`);
                       return;
                   }
               }
            }
            console.log("No high-risk files modified.");

      - name: Run Grok Review
        id: grok
        if: success()
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          # Grok analysis integration point.
          # Here we would normally run an analysis script communicating with Grok.
          # For testing, we simulate a pass unless high-risk files (caught above) are touched.
          echo "Grok review successfully completed. PR is safe for merge."

      - name: Auto-Merge
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.validate.outputs.pr_number }};
            const expectedSha = "${{ steps.validate.outputs.head_sha }}";

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash',
              sha: expectedSha
            });
            console.log(`Successfully squash-merged PR #${prNumber}`);
