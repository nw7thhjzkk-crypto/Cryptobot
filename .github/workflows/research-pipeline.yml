name: Strategy Research Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Evolution Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PAPER_MODE: "true"
        run: |
          PYTHONPATH=. python -m bot.research.evolution

      - name: Create Pull Request (DeerFlow integration hook)
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "🤖 [research] Update strategy parameters"
          title: "🤖 [research] Strategy parameter evolution proposal"
          body: |
            Automated strategy evolution run.

            Check the attached markdown reports for out-of-sample metrics and Monte Carlo robustness testing results.

            _This PR is generated by the AI Evolution Engine. Review carefully before merging._
          branch: "research/strategy-evolution"
          base: "main"
