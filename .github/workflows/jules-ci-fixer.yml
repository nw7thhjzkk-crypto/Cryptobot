name: Jules CI Failure Fixer

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  fix-ci:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Resolve Pull Request
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open'
            });
            if (pulls.length > 0) {
              const pr = pulls[0];
              // check provenance
              if (pr.user.login === 'google-labs-jules[bot]' || pr.user.login === context.repo.owner) {
                 core.setOutput('pr_number', pr.number);
                 core.setOutput('pr_branch', pr.head.ref);
                 return;
              }
            }
            core.setFailed('No eligible Jules PR found for this CI failure.');

      - name: Trigger Jules Fix
        uses: google-labs-code/jules-action@v1.0.0
        with:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          AUTO_CREATE_PR: 'true'
          starting_branch: ${{ steps.resolve-pr.outputs.pr_branch }}
          task: "The CI pipeline failed for the current PR. Please inspect the recent CI failure and fix the tests/linting issues."
