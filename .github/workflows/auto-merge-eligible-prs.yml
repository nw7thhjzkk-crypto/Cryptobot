name: Auto-merge eligible PRs

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  auto_merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate Auto-merge conditions
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluateAutoMerge } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto_merge_policy.js`);

            const run_id = context.payload.workflow_run.id;

            // Get the pull requests associated with the successful run
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id
            });

            const prs = run.data.pull_requests;
            if (prs.length === 0) {
              console.log("No PRs associated with this successful CI run. Exiting.");
              return;
            }

            const pr_number = prs[0].number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const result = evaluateAutoMerge(context, run, pr.data, files.data);

            if (!result.merged) {
              console.log(result.reason);
              return;
            }

            // Execute squash merge
            console.log("All safety gates passed. Attempting squash merge.");
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
                merge_method: 'squash',
                sha: result.sha // Enforce merging the exact validated SHA
              });
              console.log(`Successfully auto-merged PR #${pr_number}`);
            } catch (error) {
              console.error("Auto-merge failed:", error);
            }
