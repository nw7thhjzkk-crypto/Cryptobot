<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f3f4f6; /* light gray background like in the screenshot */
            color: #1f2937;
        }
        .card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .card-header {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .card-header i {
            margin-right: 0.5rem;
        }
        .value-large {
            font-size: 2.25rem;
            font-weight: 700;
            color: #111827;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-semibold">Trading Dashboard</h1>
        <div class="flex space-x-2">
            <!-- Sheet ID Input so the user can connect their sheet purely client-side -->
            <input type="text" id="sheet-id-input" placeholder="Google Sheet ID" class="border p-2 rounded text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="saveConfigAndLoad()" class="bg-white border hover:bg-gray-50 px-4 py-2 rounded text-sm font-medium flex items-center">
                <i data-lucide="refresh-cw" class="w-4 h-4 mr-2"></i> Load Data
            </button>
        </div>
    </div>

    <!-- Top Row Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">

        <!-- Cash Balance -->
        <div class="card flex flex-col justify-between">
            <div>
                <div class="card-header">
                    <i data-lucide="wallet" class="w-5 h-5"></i> CASH BALANCE
                </div>
                <div class="value-large" id="cash-balance">$0.00</div>
            </div>
            <div class="mt-4 flex justify-between items-end border-b pb-2">
                <span class="text-sm text-gray-500">Capital Deployed</span>
                <span class="text-sm text-gray-500" id="capital-deployed-pct">0%</span>
            </div>
        </div>

        <!-- Buying Power -->
        <div class="card">
            <div class="card-header">
                <i data-lucide="arrow-left-right" class="w-5 h-5"></i> BUYING POWER
            </div>
            <div class="value-large" id="buying-power">$0.00</div>
        </div>

        <!-- Bot Status -->
        <div class="card relative">
            <div class="card-header">
                <i data-lucide="power" class="w-5 h-5"></i> BOT STATUS
            </div>
            <div class="flex items-center space-x-2 mt-4">
                <div id="status-indicator" class="w-4 h-4 rounded-full bg-yellow-500"></div>
                <span id="bot-status-text" class="text-xl font-semibold text-yellow-600">Checking...</span>
            </div>
            <div class="text-xs text-gray-400 mt-2" id="last-update-text">Last update: N/A</div>

            <button class="absolute bottom-4 right-4 text-sm border rounded px-3 py-1 hover:bg-gray-50 text-gray-600">
                Fullscreen
            </button>
        </div>
    </div>

    <!-- Second Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Equity Curve Chart -->
        <div class="card lg:col-span-2">
            <div class="card-header border-l-4 border-yellow-600 pl-2 ml-[-1.5rem]">
                Equity Curve
            </div>
            <div class="relative h-64 w-full">
                <canvas id="equityChart"></canvas>
            </div>
        </div>

        <!-- Active Watchlist / Positions -->
        <div class="card">
            <div class="card-header border-l-4 border-yellow-600 pl-2 ml-[-1.5rem] flex justify-between w-full">
                <span>Active Positions</span>
                <i data-lucide="eye" class="w-5 h-5"></i>
            </div>
            <div id="positions-container" class="mt-4 h-56 overflow-y-auto">
                <div class="flex flex-col items-center justify-center h-full text-gray-400">
                    <i data-lucide="eyes" class="w-12 h-12 mb-2 bg-gray-100 p-2 rounded"></i>
                    <p>No active positions.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Third Row: Recent Trades -->
    <div class="card mt-6">
        <div class="card-header">
            Recent Trades
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-500 uppercase bg-gray-50">
                    <tr>
                        <th class="px-4 py-3">Time</th>
                        <th class="px-4 py-3">Symbol</th>
                        <th class="px-4 py-3">Side</th>
                        <th class="px-4 py-3">Qty</th>
                        <th class="px-4 py-3">Price</th>
                        <th class="px-4 py-3">Regime</th>
                        <th class="px-4 py-3">Sleeve</th>
                        <th class="px-4 py-3">Status</th>
                    </tr>
                </thead>
                <tbody id="trades-tbody">
                    <tr><td colspan="8" class="text-center py-4 text-gray-500">No trades recorded.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, function(match) {
                switch (match) {
                    case '&': return '&amp;';
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '"': return '&quot;';
                    case "'": return '&#39;';
                    default: return match;
                }
            });
        }

        // Initialize Icons
        lucide.createIcons();

        // Global Chart Instance
        let equityChartInstance = null;

        // On Load
        document.addEventListener('DOMContentLoaded', () => {
            const savedSheetId = localStorage.getItem('tradingBotSheetId');
            if (savedSheetId) {
                document.getElementById('sheet-id-input').value = savedSheetId;
                loadData(savedSheetId);
            }
        });

        function saveConfigAndLoad() {
            const sheetId = document.getElementById('sheet-id-input').value.trim();
            if (!sheetId) {
                alert("Please enter a Google Sheet ID.");
                return;
            }
            localStorage.setItem('tradingBotSheetId', sheetId);
            loadData(sheetId);
        }

        // CSV Parsing Helper (handles basic CSV format from Google Viz API)
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(l => l.trim() !== '');
            if (lines.length === 0) return [];

            // basic naive csv parse (doesn't handle commas inside quotes well, but fine for our simple numbers/words)
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, ''));
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.replace(/^"|"$/g, ''));
                const obj = {};
                headers.forEach((h, index) => {
                    obj[h] = values[index];
                });
                data.push(obj);
            }
            return data;
        }

        async function fetchSheetTab(sheetId, tabName) {
            // Using Google Visualization API to get CSV
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${tabName}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();
                // Check if the text looks like HTML (meaning it failed and gave a Google login page or error)
                if (text.trim().startsWith('<')) {
                    throw new Error("Sheet is not public. Please ensure 'Anyone with the link can view' is set in Google Sheets.");
                }
                return parseCSV(text);
            } catch (error) {
                console.error(`Error fetching ${tabName}:`, error);
                throw error;
            }
        }

        async function loadData(sheetId) {
            try {
                const [equityData, positionsData, tradesData] = await Promise.all([
                    fetchSheetTab(sheetId, 'Equity'),
                    fetchSheetTab(sheetId, 'Positions'),
                    fetchSheetTab(sheetId, 'Trades')
                ]);

                updateEquity(equityData);
                updateChart(equityData);
                updatePositions(positionsData);
                updateTrades(tradesData);
                updateBotStatus(equityData);

            } catch (error) {
                alert(`Failed to load data: ${error.message}`);
                document.getElementById('bot-status-text').innerText = "Error";
                document.getElementById('bot-status-text').className = "text-xl font-semibold text-red-600";
                document.getElementById('status-indicator').className = "w-4 h-4 rounded-full bg-red-500";
            }
        }

        function formatCurrency(numStr) {
            const num = parseFloat(numStr) || 0;
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
        }

        function updateEquity(equityData) {
            if (!equityData || equityData.length === 0) return;
            const latest = equityData[equityData.length - 1];

            const cash = parseFloat(latest.cash) || 0;
            const equity = parseFloat(latest.equity) || 0;
            const buyingPower = parseFloat(latest.buying_power) || 0;

            document.getElementById('cash-balance').innerText = formatCurrency(cash);
            document.getElementById('buying-power').innerText = formatCurrency(buyingPower);

            if (equity > 0) {
                const deployed = equity - cash;
                const deployedPct = (deployed / equity) * 100;
                document.getElementById('capital-deployed-pct').innerText = `${deployedPct.toFixed(1)}%`;
            }
        }

        function updateBotStatus(equityData) {
            const statusText = document.getElementById('bot-status-text');
            const statusInd = document.getElementById('status-indicator');
            const lastUpdate = document.getElementById('last-update-text');

            if (!equityData || equityData.length === 0) {
                statusText.innerText = "Not Running";
                statusText.className = "text-xl font-semibold text-yellow-600";
                statusInd.className = "w-4 h-4 rounded-full bg-yellow-500";
                return;
            }

            const latest = equityData[equityData.length - 1];
            if (latest.timestamp) {
                lastUpdate.innerText = `Last update: ${latest.timestamp.split('.')[0]}`;

                // Very naive check: if updated in the last 15 mins, consider it running
                // Sheet timestamps are usually string ISO dates.
                const lastTime = new Date(latest.timestamp).getTime();
                const now = new Date().getTime();
                const diffMins = (now - lastTime) / (1000 * 60);

                if (diffMins < 15) {
                    statusText.innerText = "Running";
                    statusText.className = "text-xl font-semibold text-green-600";
                    statusInd.className = "w-4 h-4 rounded-full bg-green-500";
                } else {
                    statusText.innerText = "Not Running";
                    statusText.className = "text-xl font-semibold text-yellow-600";
                    statusInd.className = "w-4 h-4 rounded-full bg-yellow-500";
                }
            }
        }

        function updateChart(equityData) {
            if (!equityData || equityData.length === 0) return;

            const labels = equityData.map(d => {
                if(!d.timestamp) return '';
                const dObj = new Date(d.timestamp);
                return `${dObj.getHours().toString().padStart(2,'0')}:${dObj.getMinutes().toString().padStart(2,'0')}`;
            });
            const values = equityData.map(d => parseFloat(d.equity) || 0);

            const ctx = document.getElementById('equityChart').getContext('2d');

            if (equityChartInstance) {
                equityChartInstance.destroy();
            }

            // Create gradient fill similar to screenshot
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(202, 138, 4, 0.2)'); // Yellow-600 with opacity
            gradient.addColorStop(1, 'rgba(202, 138, 4, 0)');

            equityChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Equity',
                        data: values,
                        borderColor: '#ca8a04', // yellow-600
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 6 }
                        },
                        y: {
                            grid: { borderDash: [4, 4], color: '#e5e7eb' },
                            ticks: {
                                callback: function(value) { return '$' + value; }
                            }
                        }
                    }
                }
            });
        }

        function updatePositions(positionsData) {
            const container = document.getElementById('positions-container');
            if (!positionsData || positionsData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 mt-8">
                        <p class="mb-2">👀</p>
                        <p>No active positions.</p>
                    </div>`;
                return;
            }

            let html = '<div class="space-y-3">';
            positionsData.forEach(pos => {
                const pnl = parseFloat(pos.unrealized_pl) || 0;
                const pnlColor = pnl >= 0 ? 'text-green-600' : 'text-red-600';

                html += `
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <div class="font-bold">${escapeHTML(pos.symbol)}</div>
                            <div class="text-xs text-gray-500">${escapeHTML(pos.qty)} shares @ $${parseFloat(pos.avg_entry_price||0).toFixed(2)}</div>
                        </div>
                        <div class="text-right">
                            <div class="${pnlColor} font-semibold">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</div>
                            <div class="text-xs text-gray-500">Current: $${parseFloat(pos.current_price||0).toFixed(2)}</div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function updateTrades(tradesData) {
            const tbody = document.getElementById('trades-tbody');
            if (!tradesData || tradesData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-gray-500">No trades recorded.</td></tr>`;
                return;
            }

            // Reverse to show newest first, and take last 10
            const recent = [...tradesData].reverse().slice(0, 10);

            let html = '';
            recent.forEach(t => {
                const sideColor = (t.side || '').toLowerCase() === 'buy' ? 'text-green-600' : 'text-red-600';
                const statusColor = (t.status || '').toLowerCase() === 'filled' ? 'text-green-600' : 'text-gray-600';
                const timeStr = t.timestamp ? t.timestamp.split('.')[0].replace('T', ' ') : '';

                html += `
                    <tr class="bg-white border-b">
                        <td class="px-4 py-2">${escapeHTML(timeStr)}</td>
                        <td class="px-4 py-2 font-medium">${escapeHTML(t.symbol)}</td>
                        <td class="px-4 py-2 ${sideColor} font-semibold uppercase">${escapeHTML(t.side)}</td>
                        <td class="px-4 py-2">${escapeHTML(t.qty)}</td>
                        <td class="px-4 py-2">$${parseFloat(t.price||0).toFixed(2)}</td>
                        <td class="px-4 py-2 text-xs">${escapeHTML(t.regime)}</td>
                        <td class="px-4 py-2 text-xs">${escapeHTML(t.sleeve)}</td>
                        <td class="px-4 py-2 ${statusColor} capitalize">${escapeHTML(t.status)}</td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
